<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>

<body>
    <h1>Test</h1>
    <script>
        let arr = ["a", "b", "c", "d", "e"];
        let ul = document.createElement("ul");
        arr.forEach((item) => {
            let li = document.createElement("li");
            li.textContent = item;
            ul.appendChild(li);
        });
        document.body.appendChild(ul);
    </script>
</body>

</html>
